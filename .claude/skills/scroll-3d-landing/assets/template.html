<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Limpide — Eau de source</title>
<meta name="description" content="Landing produit 3D pilotée par le scroll — démo Limpide, eau de source naturelle." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  SCROLL-3D-LANDING — moteur                                          ║
  ║  Tout ce qui change d'un site à l'autre est dans CONFIG (plus bas).  ║
  ║  Le reste (scène, timeline, carrousel, loader, son) est générique.   ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->

<style>
  :root {
    /* Couleurs de la variante active — réécrites en JS à chaque changement */
    --c1: #9fd8ff;          /* lueur claire */
    --c2: #06223f;          /* fond profond */
    --accent: #e8f6ff;
    --text: #f4fbff;
    --text-dim: rgba(244, 251, 255, 0.68);
    --line: rgba(244, 251, 255, 0.22);
    --pill-bg: rgba(255, 255, 255, 0.92);
    --pill-text: #06223f;
    --font-display: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --gutter: clamp(16px, 3vw, 40px);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: dark;
  }
  /* Le site a sa propre direction artistique sombre : on garde les mêmes tokens en clair/sombre,
     mais on les redéclare pour respecter le contrat de thème. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --text: #f4fbff; } }
  :root[data-theme="dark"] { --text: #f4fbff; }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  .lenis.lenis-stopped { overflow: clip; }
  body {
    margin: 0;
    background: var(--c2);
    color: var(--text);
    font-family: var(--font-display);
    font-stretch: 100%;
    overflow-x: clip;
    touch-action: pan-y;
    transition: background-color 0.8s var(--ease);
  }
  body.is-loading { overflow: hidden; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── Scène 3D fixe derrière toute la page ─────────────────────────── */
  #stage {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(90% 70% at 50% 46%, color-mix(in oklab, var(--c1) 40%, var(--c2)) 0%, var(--c2) 60%, #000 130%);
    transition: background 0.8s var(--ease);
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  body.is-grab { cursor: grab; }
  body.is-grabbing { cursor: grabbing; }
  body.is-pointer { cursor: pointer; }

  /* ── Cadre : coins, barre de progression ──────────────────────────── */
  .frame { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .frame i { position: absolute; width: 14px; height: 14px; border: 1px solid var(--line); }
  .frame i:nth-child(1) { left: var(--gutter); top: 72px; border-right: 0; border-bottom: 0; }
  .frame i:nth-child(2) { right: var(--gutter); top: 72px; border-left: 0; border-bottom: 0; }
  .frame i:nth-child(3) { left: var(--gutter); bottom: var(--gutter); border-right: 0; border-top: 0; }
  .frame i:nth-child(4) { right: var(--gutter); bottom: var(--gutter); border-left: 0; border-top: 0; }
  .progress { position: fixed; left: 50%; top: 10px; width: min(180px, 40vw); height: 2px; transform: translateX(-50%); background: var(--line); z-index: 21; overflow: hidden; border-radius: 2px; }
  .progress b { position: absolute; inset: 0; background: var(--text); transform-origin: left; transform: scaleX(0); }

  /* ── Navbar ───────────────────────────────────────────────────────── */
  .nav {
    position: fixed; inset: 0 0 auto 0; height: 64px; z-index: 20;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 var(--gutter);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .nav__sound { justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
  .nav__bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  .nav__bars span { width: 2px; height: 100%; background: currentColor; transform-origin: bottom; }
  .nav__logo { font-family: var(--font-display); font-weight: 800; font-stretch: 125%; font-style: italic; font-size: 20px; letter-spacing: -0.01em; text-decoration: none; text-transform: uppercase; }
  .nav__menu { justify-self: end; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
  .nav__menu-icon { display: grid; grid-template-columns: 4px 4px; gap: 2px; }
  .nav__menu-icon span { width: 4px; height: 4px; background: currentColor; transition: transform 0.4s var(--ease); }
  body.menu-open .nav__menu-icon span:nth-child(1) { transform: translate(3px, 3px); }
  body.menu-open .nav__menu-icon span:nth-child(2) { transform: translate(-3px, 3px); }
  body.menu-open .nav__menu-icon span:nth-child(3) { transform: translate(3px, -3px); }
  body.menu-open .nav__menu-icon span:nth-child(4) { transform: translate(-3px, -3px); }

  .menu {
    position: fixed; inset: 0; z-index: 19; display: grid; place-items: center;
    background: color-mix(in oklab, var(--c2) 88%, transparent);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    visibility: hidden; opacity: 0;
  }
  .menu ul { list-style: none; margin: 0; padding: 0; text-align: center; }
  .menu a {
    display: block; padding: 6px 0; text-decoration: none;
    font-weight: 800; font-style: italic; font-stretch: 112%; text-transform: uppercase;
    font-size: clamp(36px, 8vw, 84px); line-height: 1; letter-spacing: -0.02em;
  }
  .menu a:hover, .menu a:focus-visible { color: var(--c1); }
  .menu__foot { position: absolute; bottom: var(--gutter); left: 0; right: 0; display: flex; justify-content: center; gap: 24px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }

  /* ── Loader ───────────────────────────────────────────────────────── */
  .loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #02080f; }
  .loader__mark { font-weight: 900; font-style: italic; font-stretch: 125%; text-transform: uppercase; font-size: clamp(48px, 12vw, 150px); letter-spacing: -0.03em; line-height: 1; position: relative; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.25); }
  .loader__mark span { position: absolute; inset: 0; color: #fff; -webkit-text-stroke: 0; clip-path: inset(100% 0 0 0); }
  .loader__pct { position: absolute; bottom: calc(var(--gutter) + 24px); left: 0; right: 0; text-align: center; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.4em; color: rgba(255,255,255,0.8); }

  /* ── Sections : le texte vit au-dessus de la scène ────────────────── */
  main { position: relative; z-index: 2; pointer-events: none; }
  main a, main button, main input, main summary, main label, main form, .faq, .newsletter, .footer { pointer-events: auto; }
  .section { position: relative; min-height: 100vh; min-height: 100svh; padding: 96px var(--gutter) calc(var(--gutter) + 40px); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center; }
  .section--top { justify-content: flex-start; }
  /* Voile bas fixe : garantit le contraste du texte blanc quand le produit (clair) passe derrière.
     Fixe à l'écran (et non par section) pour n'avoir aucune couture entre deux sections. */
  .scrim { position: fixed; left: 0; right: 0; bottom: 0; height: 58vh; height: 58svh; z-index: 1; pointer-events: none;
    background: linear-gradient(to top, color-mix(in oklab, var(--c2) 80%, transparent) 0%, color-mix(in oklab, var(--c2) 38%, transparent) 45%, transparent 100%); }
  .h-display {
    margin: 0; font-weight: 900; font-style: italic; font-stretch: 118%; text-transform: uppercase;
    font-size: clamp(40px, 7.4vw, 112px); line-height: 0.88; letter-spacing: -0.025em;
    text-wrap: balance;
  }
  .h-display--xl { font-size: clamp(56px, 13vw, 200px); }
  .lede { max-width: 34ch; margin: 18px auto 0; font-size: clamp(15px, 1.25vw, 18px); line-height: 1.45; color: var(--text-dim); font-stretch: 100%; text-wrap: pretty; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .split-line { overflow: hidden; padding-bottom: 0.06em; margin-bottom: -0.06em; }

  /* Gamme : nom de la variante + flèches + pastilles */
  .gamme__name { min-height: 2em; }
  .gamme__controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 22px; }
  .arrow { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; transition: background 0.3s, border-color 0.3s; }
  .arrow:hover, .arrow:focus-visible { background: rgba(255,255,255,0.1); border-color: var(--text); }
  .dots { display: flex; gap: 8px; }
  .dots button { width: 44px; height: 24px; display: grid; place-items: center; }
  .dots button::after { content: ""; width: 100%; height: 2px; background: var(--line); transition: background 0.4s; }
  .dots button[aria-current="true"]::after { background: var(--text); }
  .hint { margin-top: 18px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); }

  /* Bénéfices : pastille barrée + rail d'icônes */
  .pill { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  .pill__x { width: 20px; height: 20px; display: grid; place-items: center; background: var(--c1); color: var(--c2); font-size: 13px; }
  .pill__t { position: relative; padding: 3px 8px; background: var(--pill-bg); color: var(--pill-text); }
  .pill__t::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 1px; background: currentColor; transform-origin: left; transform: scaleX(var(--strike, 1)); }
  .rail { position: fixed; right: var(--gutter); top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; gap: 14px; opacity: 0; visibility: hidden; }
  .rail span { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(255,255,255,0.04); transition: background 0.4s, border-color 0.4s, transform 0.4s var(--ease); }
  .rail span.is-active { background: rgba(255,255,255,0.16); border-color: var(--text); transform: scale(1.08); }
  .rail svg { width: 20px; height: 20px; }

  /* FAQ */
  .faq { justify-content: flex-start; padding-top: 18vh; }
  .faq__list { width: min(720px, 100%); margin: 40px auto 0; text-align: left; }
  .faq details { border-top: 1px solid var(--line); }
  .faq details:last-child { border-bottom: 1px solid var(--line); }
  .faq summary { list-style: none; display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 20px 0; min-height: 44px; cursor: pointer; font-size: clamp(16px, 1.4vw, 19px); font-weight: 600; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-family: var(--font-mono); font-weight: 400; transition: transform 0.4s var(--ease); }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq__a { overflow: hidden; }
  .faq__a p { margin: 0; padding: 0 0 22px; color: var(--text-dim); line-height: 1.55; max-width: 60ch; }

  /* Newsletter + footer */
  .newsletter { justify-content: center; }
  .newsletter form { display: flex; gap: 8px; width: min(520px, 100%); margin: 28px auto 0; }
  .newsletter input { flex: 1; min-width: 0; min-height: 48px; padding: 0 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--text); font: 500 13px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; border-radius: 0; }
  .newsletter input::placeholder { color: var(--text-dim); }
  .newsletter input:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .btn { min-height: 48px; padding: 0 22px; background: var(--text); color: var(--c2); font: 600 12px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; position: relative; overflow: hidden; }
  .btn:hover { background: var(--c1); }
  .newsletter__msg { min-height: 1.5em; margin-top: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .footer { position: relative; z-index: 2; padding: 28px var(--gutter) calc(var(--gutter) + 8px); display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); border-top: 1px solid var(--line); background: color-mix(in oklab, var(--c2) 70%, #000); }
  .footer nav { display: flex; gap: 18px; flex-wrap: wrap; }
  .footer a { text-decoration: none; }
  .footer a:hover { color: var(--text); }

  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  @media (max-width: 760px) {
    .frame i:nth-child(1), .frame i:nth-child(2) { top: 64px; }
    .rail { right: 10px; gap: 10px; }
    .rail span { width: 36px; height: 36px; }
    .section { padding-bottom: calc(var(--gutter) + 24px); }
    .newsletter form { flex-direction: column; }
    .nav__sound-label { display: none; }
  }

  /* Sans WebGL : la page reste lisible, le fond reste en dégradé */
  html.no-webgl #stage canvas { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
    "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.23/dist/lenis.mjs"
  }
}

</head>
<body class="is-loading">

<div class="loader" aria-hidden="true">
  <div class="loader__mark" data-brand>Limpide<span data-brand>Limpide</span></div>
  <div class="loader__pct"><span data-pct>0</span>%</div>
</div>

<div id="stage" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="progress" aria-hidden="true"><b></b></div>

<header class="nav">
  <button class="nav__sound" type="button" aria-pressed="true" aria-label="Couper le son">
    <span class="nav__bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
    <span class="nav__sound-label" data-sound-label>On</span>
  </button>
  <a class="nav__logo" href="#gamme" data-brand>Limpide</a>
  <button class="nav__menu" type="button" aria-expanded="false" aria-controls="menu">
    <span class="nav__menu-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
    Menu
  </button>
</header>

<nav class="menu" id="menu" aria-label="Menu principal">
  <ul data-menu></ul>
  <div class="menu__foot" data-socials></div>
</nav>

<div class="rail" aria-hidden="true" data-rail></div>

<main id="content">
  <!-- Les sections sont générées depuis CONFIG.sections (voir renderSections). -->
</main>

<footer class="footer" data-footer></footer>

<script>
/* ════════════════════════════════════════════════════════════════════════
   CONFIG — la seule partie à réécrire pour un nouveau site.
   ════════════════════════════════════════════════════════════════════════ */
window.CONFIG = {
  brand: 'Limpide',
  tagline: 'Eau de source naturelle',
  locale: 'fr',

  /* Produit : 'bottle' | 'can' (procéduraux) ou { gltf: 'https://…/model.glb', labelMesh: 'Label' } */
  product: {
    type: 'bottle',     // bouteille PET détaillée
    size: '50 cl',
    droplets: true,     // gouttes de condensation sur la bouteille
    minerals: [['Calcium', '4'], ['Magnésium', '1'], ['Sodium', '3'], ['Bicarbonates', '18'], ['Résidu sec à 180 °C', '32'], ['pH', '6,8']],
  },

  /* Une entrée par variante. c1 = lueur claire, c2 = fond profond, cap = bouchon / accent 3D. */
  variants: [
    { id: 'source',  name: ['Source', 'Plate'],   desc: "Une eau de source faiblement minéralisée, filtrée par 40 mètres de granit. Rien d'ajouté, rien d'enlevé.",               c1: '#9fd8ff', c2: '#05213d', cap: '#dfeefa', liquid: '#cfefff' },
    { id: 'bulles',  name: ['Fines', 'Bulles'],   desc: 'Des bulles fines et serrées, ajoutées à la source. Une effervescence nette qui ne pique pas.',                           c1: '#c4f1ff', c2: '#0a2c4c', cap: '#7fb6d8', liquid: '#e4f8ff', bubbles: true },
    { id: 'yuzu',    name: ['Citron', 'Yuzu'],    desc: "Quelques gouttes d'extrait de yuzu et de citron de Menton. Zéro sucre, juste un éclat d'agrume.",                         c1: '#eef7a0', c2: '#16341f', cap: '#d9e35a', liquid: '#f6fbd6', bubbles: true },
    { id: 'menthe',  name: ['Menthe', 'Concombre'], desc: 'La fraîcheur du concombre, une pointe de menthe poivrée. Une eau qui désaltère deux fois.',                            c1: '#aaf5d2', c2: '#053a2e', cap: '#5fd6a4', liquid: '#dcfbec' },
    { id: 'sureau',  name: ['Fleur de', 'Sureau'], desc: 'Un parfum floral et délicat, infusé à froid. Pour les après-midi qui méritent mieux que de l’eau plate.',                c1: '#f1d8ff', c2: '#2a1242', cap: '#c79be6', liquid: '#f6ecff' },
  ],

  /* Bénéfices : "crossed" = ce que les autres font (barré), title = ce qu'on fait. icon = clé de ICONS. */
  benefits: [
    { icon: 'leaf',   crossed: 'Plastique vierge',    title: ['100 %', 'recyclée'],      text: 'Bouteille en plastique 100 % recyclé, recyclable à son tour, bouchon attaché. Rien de neuf, rien de perdu.' },
    { icon: 'drop',   crossed: 'Résidu sec 450 mg/L',  title: ['Très faiblement', 'minéralisée'], text: '32 mg/L de résidu sec. Une eau légère, au goût neutre, qui accompagne tout.' },
    { icon: 'shield', crossed: 'Eau traitée',          title: ['Source', 'protégée'],      text: 'Captée à 40 mètres sous un massif classé. Aucune désinfection, aucun traitement : elle n’en a pas besoin.' },
    { icon: 'spark',  crossed: 'Sucres ajoutés',       title: ['Arômes', 'naturels'],      text: 'Nos versions aromatisées ne contiennent que des extraits de fruits et de plantes. Zéro sucre, zéro édulcorant.' },
  ],

  manifesto: ['Rien', "d'autre", "que l'eau"],
  packshot: { eyebrow: 'La gamme', title: ['Cinq', 'eaux'] },

  faq: [
    { q: 'D’où vient l’eau Limpide ?', a: 'D’une source unique captée à 40 mètres de profondeur, dans un massif granitique protégé. Elle est embouteillée sur place, à la sortie de la source.' },
    { q: 'La bouteille est-elle recyclable ?', a: 'Oui. Elle est fabriquée à 100 % en plastique recyclé (rPET) et se recycle entièrement, bouchon compris : il reste attaché pour ne pas se perdre.' },
    { q: 'Les versions aromatisées contiennent-elles du sucre ?', a: 'Non. Elles contiennent uniquement de l’eau de source et des extraits naturels de fruits ou de plantes. 0 kcal, 0 g de sucre, aucun édulcorant.' },
    { q: 'Quelle est la composition minérale ?', a: 'Résidu sec à 180 °C : 32 mg/L. Calcium 4 mg/L, magnésium 1 mg/L, sodium 3 mg/L, pH 6,8. Convient à la préparation des aliments des nourrissons.' },
    { q: 'Comment conserver une bouteille entamée ?', a: 'Au frais, bouchée, et à consommer dans les 3 jours. Avant ouverture, à l’abri de la lumière et de la chaleur.' },
  ],

  newsletter: { title: ['Restez', 'à la source'], text: 'Nouvelles variantes, éditions limitées. Un mail par mois, pas plus.', placeholder: 'Votre adresse mail', cta: "S'inscrire", success: 'Merci ! Vous êtes inscrit·e.' },
  socials: [{ label: 'Instagram', href: '#' }, { label: 'TikTok', href: '#' }],
  legal: [{ label: 'Mentions légales', href: '#' }, { label: 'CGU', href: '#' }, { label: 'Confidentialité', href: '#' }],
  footerNote: '© 2026 Limpide — marque fictive, démo',

  /* Sons : 'synth' = générés en Web Audio (aucun fichier), ou des URLs mp3 par clé. */
  sounds: 'synth',

  /* Keyframes 3D : un état par section, dans l'ordre des sections.
     Champs : camZ, camY, x, y, scale, rotX, rotY (spin), rotZ (inclinaison), spread (écart des autres produits, 1 = carrousel),
     others (0..1 visibilité des produits non actifs), swipe (drag autorisé). Les valeurs manquantes héritent de la section précédente. */

    gamme:      { camZ: 19, camY: 0.4, x: 0, y: 1.0, scale: 0.92, rotX: 0, rotY: 0, rotZ: 0.06, spread: 1, others: 1, swipe: true },

/* ── 2. Smooth scroll (Lenis) + ScrollTrigger ─────────────────────────── */
const lenis = reduceMotion ? null : new Lenis({ autoRaf: false, lerp: 0.09, wheelMultiplier: 0.9 });
const getScroll = () => (lenis ? lenis.animatedScroll : scrollY);
const scrollTo = (target, opts = {}) => {
  const y = typeof target === 'number' ? target : $(target)?.offsetTop ?? 0;
  if (lenis) lenis.scrollTo(y, { duration: 1.4, easing: (t) => 1 - Math.pow(1 - t, 4), ...opts });
  else scrollTo_native(y);
};
const scrollTo_native = (y) => window.scrollTo({ top: y, behavior: reduceMotion ? 'auto' : 'smooth' });
if (lenis) {
  lenis.on('scroll', ScrollTrigger.update);

}

/* Aimantation douce sur les sections [data-snap] (gamme → profil) */
let snapTimer;
const snapPoints = () => $$('[data-snap]').map((el) => el.offsetTop);
function maybeSnap() {
  if (!lenis || lenis.isStopped || swipe.holding) return;
  const y = getScroll();
  const pts = snapPoints();
  const last = pts[pts.length - 1];
  if (y >= last - 2) return; // on n'aimante qu'entre les points, jamais en arrière depuis la suite
  const nearest = pts.reduce((a, b) => (Math.abs(b - y) < Math.abs(a - y) ? b : a));
  if (Math.abs(nearest - y) > 2) lenis.scrollTo(nearest, { duration: 0.9, easing: (t) => 1 - Math.pow(1 - t, 3) });
}
const scheduleSnap = () => { clearTimeout(snapTimer); snapTimer = setTimeout(maybeSnap, 180); };

/* ── 3. Son (Web Audio synthétisé, débloqué au premier geste) ─────────── */
const sound = (() => {
  let ctx = null, unlocked = false;
  let muted = store.get('sound') === 'off';
  const buffers = {};
  const init = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); };
  const unlock = () => {
    init(); unlocked = true;
    if (typeof C.sounds === 'object') Object.entries(C.sounds).forEach(async ([k, url]) => { try { buffers[k] = await ctx.decodeAudioData(await (await fetch(url)).arrayBuffer()); } catch {} });
    ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach((e) => removeEventListener(e, unlock));
  };
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach((e) => addEventListener(e, unlock, { passive: true }));
  const env = (g, t, a, d, peak) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const synth = {
    // goutte d'eau : sinus qui monte vite (signature "liquide")
    drop() { const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(1500, t + 0.07); env(g, t, 0.005, 0.12, 0.25); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.2); },
    // clic d'interface
    click() { const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = 1800; env(g, t, 0.002, 0.04, 0.12); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.08); },
    // souffle : bruit filtré qui balaie (transition de section)
    whoosh() {
      const t = ctx.currentTime, len = 0.7, b = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = b; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2400, t + len * 0.6);
      env(g, t, 0.15, 0.5, 0.12); src.connect(f).connect(g).connect(ctx.destination); src.start(t);
    },
  };
  const play = (name) => {
    if (!unlocked || muted || !ctx) return;
    if (buffers[name]) { const s = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = 0.5; s.buffer = buffers[name]; s.connect(g).connect(ctx.destination); s.start(); return; }
    if (C.sounds === 'synth' && synth[name]) synth[name]();
  };
  return { play, get muted() { return muted; }, set muted(v) { muted = v; store.set('sound', v ? 'off' : 'on'); } };
})();

/* ── 4. Scène Three.js ────────────────────────────────────────────────── */

const colors = { c1: new THREE.Color(C.variants[0].c1), c2: new THREE.Color(C.variants[0].c2), t1: new THREE.Color(C.variants[0].c1), t2: new THREE.Color(C.variants[0].c2) };
let scene, camera, products = [], backdrop, raycaster, pmrem;

if (renderer) {

  renderer.toneMapping = THREE.ACESFilmicToneMapping;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 0.1, 200);
  pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.03).texture;
  raycaster = new THREE.Raycaster();

  /* Fond : dégradé radial + reflets "caustiques" en shader, réfracté par le verre */
  backdrop = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.ShaderMaterial({
      depthWrite: false, depthTest: false,
      uniforms: { uC1: { value: colors.c1 }, uC2: { value: colors.c2 }, uTime: { value: 0 }, uAspect: { value: innerWidth / innerHeight } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }',
      fragmentShader: `
        uniform vec3 uC1; uniform vec3 uC2; uniform float uTime; uniform float uAspect; varying vec2 vUv;
        void main(){
          vec2 p = (vUv - vec2(0.5, 0.46)) * vec2(uAspect, 1.0);
          float r = length(p);
          // lueur contenue derrière le produit : le texte blanc doit rester lisible
          vec3 glow = mix(uC2, uC1, 0.42);
          vec3 col = mix(glow, uC2, smoothstep(0.0, 0.62, r));
          col = mix(col, uC2 * 0.3, smoothstep(0.55, 1.3, r));
          // fines lignes de lumière qui ondulent, comme le fond d'une piscine
          vec2 q = p * 7.0;
          float c = sin(q.x * 1.6 + uTime * 0.35 + sin(q.y * 1.3 + uTime * 0.25) * 1.6)
                  + sin(q.y * 1.9 - uTime * 0.3 + sin(q.x * 1.1 - uTime * 0.2) * 1.4);
          c = pow(clamp(1.0 - abs(c) * 1.2, 0.0, 1.0), 8.0);
          col += uC1 * c * 0.07 * (1.0 - smoothstep(0.1, 0.9, r));
          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`,
    }),
  );
  backdrop.frustumCulled = false;
  backdrop.renderOrder = -10;
  scene.add(backdrop);

  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 6, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 1.6); rim.position.set(-6, 2, -4); scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
}

function makeLabelTexture(v) {
  const cv = document.createElement('canvas'); cv.width = 2048; cv.height = 512;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.0)'; g.fillRect(0, 0, 2048, 512);
  // bande givrée centrée sur la face avant (u = 0.5)

  g.fillStyle = grd; g.fillRect(0, 0, 2048, 512);
  g.fillStyle = v.c2; g.textAlign = 'center';
  g.font = 'italic 900 150px Archivo, Helvetica, Arial, sans-serif';

  const t = new THREE.CanvasTexture(cv);

}

/* ── Bouteille PET réaliste, 100 % procédurale ──────────────────────────
   Profil r(y) échantillonné finement (rainures, zone d'étiquette, anneaux de
   préhension, épaule, col, collerette), fond pétaloïde à 5 pieds déformé par
   sommet, bouchon strié + bague d'inviolabilité, étiquette imprimée tout autour,
   gouttes de condensation et bulles. Unités : hauteur ≈ 4,8, centrée sur y = 0. */
const PET = { bottom: -2.3, fill: 1.15, labelY0: -1.27, labelY1: -0.15, labelR: 0.857 };
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const groove = (y, centers, depth, hw) => centers.reduce((acc, c) => acc + depth * (1 - sstep(0, hw, Math.abs(y - c))), 0);
function petRadius(y) {
  if (y < -2.0) return 0.64 + 0.22 * Math.sin(((y + 2.3) / 0.3) * Math.PI / 2);
  if (y < -1.3) return 0.86 - groove(y, [-1.8, -1.55], 0.035, 0.05);
  if (y < -0.12) return 0.85 + 0.01 * (1 - sstep(-1.32, -1.26, y)) + 0.01 * sstep(-0.18, -0.12, y);
  if (y < 0.72) return 0.86 - groove(y, [0.0, 0.18, 0.36, 0.54], 0.06, 0.065);
  if (y < 1.62) { const t = (y - 0.72) / 0.9; return 0.42 + 0.44 * (0.5 + 0.5 * Math.cos(Math.PI * t)); }
  if (y < 1.9) return 0.42 - 0.05 * sstep(1.62, 1.76, y);
  if (y < 2.0) return 0.37 + 0.13 * sstep(1.9, 1.925, y) * (1 - sstep(1.975, 2.0, y)); // collerette
  return 0.36;
}
function latheFrom(pts, seg) { return new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg); }
// fond pétaloïde : entre les 5 pieds, la paroi remonte et rentre
function petaloid(geo, k = 1) {
  const pos = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    if (v.y > -2.0) continue;
    const t = clamp((-2.0 - v.y) / 0.3, 0, 1), th = Math.atan2(v.x, v.z);
    const valley = Math.pow(1 - (0.5 + 0.5 * Math.cos(5 * th)), 1.5);
    const sc = 1 - 0.28 * t * valley * k;
    pos.setXYZ(i, v.x * sc, v.y + 0.16 * t * valley * k, v.z * sc);
  }
  geo.computeVertexNormals();
  return geo;
}
// déplacement radial en fonction de l'angle (stries du bouchon, bague)
function radialBump(geo, y0, y1, fn) {
  const pos = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const r = Math.hypot(v.x, v.z);
    if (v.y < y0 || v.y > y1 || r < 0.3) continue;

  master = gsap.timeline({ paused: true, defaults: { ease: 'power1.inOut' } });

  watchPerf(dt, t);

  // carrousel lissé + variante active
  carousel.pos = lerp(carousel.pos, carousel.target, 1 - Math.pow(0.0015, dt));
  const activeSlot = Math.round(carousel.pos / carousel.spacing);
  const idx = wrap(activeSlot, 0, N);
  if (idx !== carousel.index) setVariant(idx);

  // couleurs qui glissent vers la variante active
  const kc = 1 - Math.pow(0.02, dt);
  colors.c1.lerp(colors.t1, kc); colors.c2.lerp(colors.t2, kc);
  backdrop.material.uniforms.uTime.value = t;

  // pointeur lissé : légère parallaxe caméra
  pointer.sx = lerp(pointer.sx, (pointer.x / innerWidth - 0.5), 0.05);
  pointer.sy = lerp(pointer.sy, (pointer.y / innerHeight - 0.5), 0.05);

  const mobileScale = innerWidth < 760 ? 0.78 : 1;
  camera.position.set(pointer.sx * 0.6, state.camY - pointer.sy * 0.4, state.camZ / mobileScale);
  camera.lookAt(0, state.camY * 0.6, 0);

  const half = carousel.span / 2;
  products.forEach((p, i) => {
    const offset = wrap(i * carousel.spacing - carousel.pos, -half, half);
    p.userData.offset = offset;
    const isActive = Math.abs(offset) < carousel.spacing / 2;
    const vis = isActive ? 1 : state.others;
    const idle = reduceMotion ? 0 : Math.sin(t * 0.8 + i) * 0.06;
    p.position.set(
      (isActive ? state.x * Math.min(1, camera.aspect / 1.5) : 0) + offset * state.spread,
      state.y + idle + intro.y * (1 + Math.abs(offset) * 0.08),
      -Math.abs(offset) * 0.35,
    );
    const s = state.scale * intro.s * (isActive ? 1 : 0.92) * (0.001 + vis);
    p.scale.setScalar(s);
    p.rotation.set(isActive ? state.rotX : 0.02, (isActive ? state.rotY : 0) + offset * -0.12 + (reduceMotion ? 0 : Math.sin(t * 0.4 + i) * 0.22), state.rotZ - offset * 0.025);
    p.visible = s > 0.01 && Math.abs(p.position.x) < 30;
    const bub = p.userData.bubbles;
    if (bub && p.visible && !reduceMotion) {
      const m = new THREE.Matrix4();
      bub.userData.seeds.forEach((b, k) => {
        b.y += dt * b.k * 0.5; if (b.y > bub.userData.top) b.y = bub.userData.bottom;
        const wob = Math.sin(t * 3 + k) * 0.03, rr = (petRadius(b.y) - 0.09) * b.f;
        m.makeScale(b.s, b.s, b.s).setPosition(Math.cos(b.a) * rr + wob, b.y, Math.sin(b.a) * rr);
        bub.setMatrixAt(k, m);
      });
      bub.instanceMatrix.needsUpdate = true;
    }
  });

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  if (renderer) {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    backdrop.material.uniforms.uAspect.value = innerWidth / innerHeight;
  }
  clearTimeout(window.__rz); window.__rz = setTimeout(() => { ScrollTrigger.refresh(); buildTimeline(); }, 200);
});

/* ── 10. Menu, FAQ, newsletter ───────────────────────────────────────── */
const menuBtn = $('.nav__menu');
function toggleMenu(open = !document.body.classList.contains('menu-open')) {
  document.body.classList.toggle('menu-open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  sound.play('click');
  if (open) { lenis?.stop(); gsap.to('.menu', { autoAlpha: 1, duration: 0.4 }); gsap.fromTo('.menu li', { yPercent: 60, autoAlpha: 0 }, { yPercent: 0, autoAlpha: 1, stagger: 0.05, duration: 0.6, ease: 'power3.out' }); $('.menu a')?.focus({ preventScroll: true }); }
  else { lenis?.start(); gsap.to('.menu', { autoAlpha: 0, duration: 0.3 }); }
}
menuBtn.addEventListener('click', () => toggleMenu());
addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.classList.contains('menu-open')) { toggleMenu(false); menuBtn.focus(); } });
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const id = a.getAttribute('href'); if (id.length < 2) return;
  e.preventDefault();
  if (document.body.classList.contains('menu-open')) toggleMenu(false);
  scrollTo(id, { duration: 1.8 });
});

$$('.faq details').forEach((d) => {
  const sum = $('summary', d), body = $('.faq__a', d);
  sum.addEventListener('click', (e) => {
    e.preventDefault(); sound.play('click');
    if (d.open) gsap.to(body, { height: 0, duration: 0.4, ease: 'power2.inOut', onComplete: () => { d.open = false; gsap.set(body, { clearProps: 'height' }); ScrollTrigger.refresh(); } });
    else { d.open = true; gsap.from(body, { height: 0, duration: 0.5, ease: 'power3.out', onComplete: () => ScrollTrigger.refresh() }); }
  });
});

$('.newsletter form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = $('#nl-email'), msg = $('.newsletter__msg');
  if (!input.checkValidity()) { msg.textContent = 'Adresse mail invalide.'; input.focus(); return; }
  msg.textContent = C.newsletter.success; input.value = ''; sound.play('drop');
});

/* ── 11. Démarrage : loader → intro ──────────────────────────────────── */
(async () => {
  const minDelay = new Promise((r) => setTimeout(r, reduceMotion ? 200 : 1400));
  try { await buildProducts(); } catch (err) { console.error('[scroll-3d] produits', err); }
  pct.target = 100;
  await minDelay;
  applyColors(0);
  colors.c1.copy(colors.t1); colors.c2.copy(colors.t2);
  buildTimeline();
  buildReveals();
  if (renderer) renderer.compile(scene, camera);
  gsap.ticker.add(frame);

  const introTl = gsap.timeline({ defaults: { ease: 'power3.out' } });
  introTl.to('.loader__pct', { autoAlpha: 0, duration: 0.3 }, 0.2)
       .to('.loader', { clipPath: 'inset(0 0 100% 0)', duration: reduceMotion ? 0.01 : 1.0, ease: 'power4.inOut' }, 0.35)
       .to(intro, { y: 0, s: 1, duration: reduceMotion ? 0.01 : 1.8, ease: 'expo.out' }, 0.45)
       .from('.nav > *, .frame i, .progress', { autoAlpha: 0, y: -10, stagger: 0.05, duration: 0.6 }, 1.0)
       .from('#gamme .split-inner', { yPercent: 110, stagger: 0.08, duration: 0.9, ease: 'power4.out' }, 1.0)
       .from('#gamme .eyebrow, #gamme .gamme__controls, #gamme .hint', { autoAlpha: 0, y: 14, stagger: 0.08, duration: 0.7 }, 1.2)
       .add(() => { document.body.classList.remove('is-loading'); $('.loader').remove(); lenis?.start(); ScrollTrigger.refresh(); }, 1.3);
})();

window.__scroll3d = { state, carousel, scrollTo, setVariant, get lenis() { return lenis; } }; // debug / tests
</script>
</body>
